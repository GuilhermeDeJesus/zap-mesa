# Proxy reverso cPanel — VirtualHost include
#
# Copiar para o servidor em:
#   HTTP:  /etc/apache2/conf.d/userdata/std/2_4/zapmesa/zapmesa.com.br/proxy.conf
#   HTTPS: /etc/apache2/conf.d/userdata/ssl/2_4/zapmesa/zapmesa.com.br/proxy.conf
#
# Após copiar, reconstruir e recarregar:
#   /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl reload httpd
#
# Docker expõe: backend em 127.0.0.1:3333, frontend em 127.0.0.1:3001

ProxyRequests Off
ProxyPreserveHost On

RewriteEngine On

# WebSocket (Socket.IO)
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3333/socket.io/$1 [P,L]

# ACME challenge - servir direto do filesystem (não proxiar)
ProxyPassMatch ^/(\.well-known/.*)$ !

# API -> backend porta 3333
ProxyPassMatch ^/api/(.*)$ http://127.0.0.1:3333/$1
ProxyPassReverse /api/ http://127.0.0.1:3333/

# _next assets -> frontend porta 3001
ProxyPassMatch ^/(_next/.*)$ http://127.0.0.1:3001/$1
ProxyPassReverse /_next/ http://127.0.0.1:3001/

# Tudo o mais -> frontend Next.js porta 3001
ProxyPass / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/
