services:

  mysql:
    image: mysql:8.0
    container_name: zap-mesa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: zapmesa123
      MYSQL_DATABASE: zapmesa
      MYSQL_USER: zapmesa
      MYSQL_PASSWORD: zapmesa123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: zap-mesa-backend
    restart: always
    command: npm run dev
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: "mysql://zapmesa:zapmesa123@mysql:3306/zapmesa"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: zap-mesa-frontend
    restart: always
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
